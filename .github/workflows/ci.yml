name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Pick simulator (simple & robust)
        id: pick-sim
        shell: bash
        run: |
          set -euo pipefail
          DEVICES_OUTPUT="$(xcrun simctl list devices)"
          echo "== Devices (all) =="; echo "$DEVICES_OUTPUT"

          # 1) Пробуем iPhone 16 Pro
          DEVICE_LINE="$(grep -E 'iPhone 16 Pro .*\([0-9A-F-]+\) \((Booted|Shutdown)\)' <<< "$DEVICES_OUTPUT" | head -n1 || true)"
          # 2) Иначе берем любой iPhone
          if [[ -z "${DEVICE_LINE}" ]]; then
            DEVICE_LINE="$(grep -E 'iPhone .*\([0-9A-F-]+\) \((Booted|Shutdown)\)' <<< "$DEVICES_OUTPUT" | head -n1 || true)"
          fi
          [[ -n "${DEVICE_LINE}" ]] || { echo "ERROR: No iPhone simulator found"; exit 1; }
          echo "Picked device line: $DEVICE_LINE"

          # Имя девайса (до первой скобки)
          DEVICE_NAME="$(sed -E 's/ *\([^)]*\).*//' <<< "$DEVICE_LINE" | sed -E 's/^ *//; s/ *$//')"
          # UDID = ПЕРВЫЕ круглые скобки (вторые — статус)
          UDID="$(sed -nE 's/.*\(([0-9A-F-]+)\).*/\1/p' <<< "$DEVICE_LINE" | head -n1)"
          [[ -n "$UDID" ]] || { echo "ERROR: Could not extract UDID"; exit 1; }

          echo "Using device: $DEVICE_NAME (UDID=$UDID)"
          echo "UDID=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.pick-sim.outputs.UDID }}" || true
          xcrun simctl bootstatus "${{ steps.pick-sim.outputs.UDID }}" -b

      - name: Resolve SPM
        run: xcodebuild -scheme "KitchenScan" -resolvePackageDependencies

      - name: Build for Testing (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "KitchenScan" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            -destination "id=${{ steps.pick-sim.outputs.UDID }}" \
            -destination-timeout 300 \
            clean build-for-testing \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_WARN_UNGUARDED_AVAILABILITY=YES_AGGRESSIVE \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            -showBuildTimingSummary

      - name: Test (without building)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "KitchenScan" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            -destination "id=${{ steps.pick-sim.outputs.UDID }}" \
            -destination-timeout 300 \
            -parallel-testing-enabled NO \
            -only-testing:KitchenScanTests \
            test-without-building \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload test result bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
