name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Pick simulator (robust by UDID)
        id: pick-sim
        shell: bash
        run: |
          set -euo pipefail
          echo "== Runtimes =="; xcrun simctl list runtimes
          echo "== Devices (all) =="; xcrun simctl list devices

          # 1) Выбираем iOS runtime: приоритет 18.6 → 18.5 → 18.4, иначе любой iOS
          RUNTIME_LINE="$(xcrun simctl list runtimes | grep -E '^iOS (18\.6|18\.5|18\.4)' | head -n1 || true)"
          if [[ -z "${RUNTIME_LINE}" ]]; then
            RUNTIME_LINE="$(xcrun simctl list runtimes | grep -E '^iOS [0-9]+\.[0-9]+' | tail -n1)"
          fi
          echo "Picked runtime line: $RUNTIME_LINE"

          # Извлекаем идентификатор рантайма, например com.apple.CoreSimulator.SimRuntime.iOS-18-6
          RUNTIME_ID="$(sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/' <<< "$RUNTIME_LINE")"
          [[ -n "$RUNTIME_ID" ]] || { echo "ERROR: No iOS runtime id"; exit 1; }
          echo "RUNTIME_ID=$RUNTIME_ID"

          echo "== Devices for runtime =="
          xcrun simctl list devices "$RUNTIME_ID"

          # 2) Берём девайс: сперва iPhone 16 Pro, иначе любой iPhone
          DEVICE_LINE="$(xcrun simctl list devices "$RUNTIME_ID" | grep -E 'iPhone 16 Pro' | head -n1 || true)"
          if [[ -z "${DEVICE_LINE}" ]]; then
            DEVICE_LINE="$(xcrun simctl list devices "$RUNTIME_ID" | grep -E 'iPhone ' | head -n1)"
          fi
          echo "Picked device line: $DEVICE_LINE"

          # Имя девайса (до первой скобки)
          DEVICE_NAME="$(sed -E 's/ *\([^)]*\).*//' <<< "$DEVICE_LINE" | sed -E 's/^ *//; s/ *$//')"
          # UDID (первые круглые скобки)
          UDID="$(sed -E 's/.*\(([0-9A-F-]+)\).*/\1/' <<< "$DEVICE_LINE")"

          [[ -n "$UDID" && -n "$DEVICE_NAME" ]] || { echo "ERROR: Could not extract UDID/device"; exit 1; }

          echo "Using device: $DEVICE_NAME"
          echo "UDID=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.pick-sim.outputs.UDID }}" || true
          xcrun simctl bootstatus "${{ steps.pick-sim.outputs.UDID }}" -b

      - name: Resolve SPM
        run: xcodebuild -scheme "KitchenScan" -resolvePackageDependencies

      - name: Build for Testing (Debug)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "KitchenScan" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            -destination "id=${{ steps.pick-sim.outputs.UDID }}" \
            -destination-timeout 300 \
            clean build-for-testing \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CLANG_WARN_UNGUARDED_AVAILABILITY=YES_AGGRESSIVE \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            -showBuildTimingSummary

      - name: Test (without building)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme "KitchenScan" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            -destination "id=${{ steps.pick-sim.outputs.UDID }}" \
            -destination-timeout 300 \
            -parallel-testing-enabled NO \
            -only-testing:KitchenScanTests \
            test-without-building \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload test result bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
